name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ADR-067 / ADR-069 §3: the core must stay industry-neutral. Runs before the
      # build so a vocabulary leak fails fast and cheaply.
      - name: Industry-vocabulary guard
        run: bash build/check-core-vocabulary.sh

      # GitHub Packages requires authentication even for PUBLIC packages, and the automatic
      # GITHUB_TOKEN cannot read another repository's packages -- hence an explicit secret.
      # nuget.config reads it from this environment variable; packageSourceMapping keeps the
      # private feed limited to SpaceOS.* so nothing else can be substituted from it.
      - name: Restore
        env:
          SPACEOS_PACKAGES_TOKEN: ${{ secrets.SPACEOS_PACKAGES_TOKEN }}
        # --locked-mode (ADR-070 supply chain): restore must match the committed lockfiles
        # exactly. A transitive version that drifted since the last commit fails here instead
        # of quietly changing what the module ships.
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The Doorstar compatibility gate lives inside this run: the fixture's SHA-256 pin
      # is verified at test start, so a silently changed input pack fails the build
      # rather than quietly redefining the contract.
      - name: Test (includes the pinned Doorstar compatibility gate)
        run: dotnet test --no-build --configuration Release --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ADR-069 §6 generated-client gate: Doorstar builds its client from docs/openapi.yaml,
      # so a spec this generator cannot process is a SPEC BUG and must fail the build here --
      # not in the consumer's pipeline. The .NET suite already proved the spec matches the
      # routes and the DTO shapes; this proves it is machine-consumable.
      - name: Generate the TypeScript client from the contract
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/scheduling-client.ts"
          npx --yes openapi-typescript@7 docs/openapi.yaml -o "$out"
          # A generator can emit an empty-but-valid file; check the operations actually
          # arrived, otherwise the gate would pass on a spec that produced nothing usable.
          for symbol in listScheduleRuns getProposal getResourceOverload Proposal OperationPlan; do
            grep -q "$symbol" "$out" || { echo "Generated client is missing '$symbol'."; exit 1; }
          done
          echo "Generated client: $(wc -l < "$out") lines."
